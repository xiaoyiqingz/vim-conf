" Plugins {
    " vim-colorschemes {
        if isdirectory(expand("~/.vim/plugged/vim-colorschemes"))
            color molokai
        endif
    "}

    " vim-better-whitespace {
        if isdirectory(expand("~/.vim/plugged/vim-better-whitespace"))
            nnoremap <Leader>xd :StripWhitespace<CR>

            let g:better_whitespace_filetypes_blacklist = ['markdown', 'dashboard']
        endif
    " }

    " delimitMate {
        if isdirectory(expand("~/.vim/plugged/delimitMate"))
            let delimitMate_expand_cr=0
            " need to reload the file
            nnoremap <leader>D :let b:delimitMate_autoclose = 0<CR> :e<CR>
            nnoremap <leader>d :let b:delimitMate_autoclose = 1<CR> :e<CR>
        endif
    " }

    " vim-airline {
      if isdirectory(expand("~/.vim/plugged/vim-airline"))
          let t_Co=256
          let g:airline_theme="powerlineish"
          let g:Powerline_symbols="fancy"
          " use powerline font. If not, let g:airline_powerline_fonts=0
          let g:airline_powerline_fonts=1
          let g:airline#extensions#tabline#enabled=1
          let g:airline#extensions#tabline#buffer_nr_show=1
          let g:airline#extensions#whitespce#enabled=0
          let g:airline#extensions#whitespace#symbol='!'
          let g:airline#extensions#whitespace#mixed_indent_algo=2
          let g:airline#extensions#ale#enabled=1
          let g:airline#extensions#ale#show_line_numbers=1
          let g:airline#extensions#ale#open_lnum_symbol='[line:'
          let g:airline#extensions#ale#close_lnum_symbol=']'
          if !exists('g:airline_powerline_fonts')
              let g:airline_left_sep='>'
              let g:airline_right_sep='<'
          endif
      endif
    " }

     " tagbar {
         if isdirectory(expand("~/.vim/plugged/tagbar"))
             let g:tagbar_autofocus = 1
             let g:tagbar_sort = 0
             let g:tagbar_show_linenumbers = 1
             nnoremap <S-t> :TagbarToggle<CR>

             let g:tagbar_type_go = {
                         \ 'ctagstype' : 'go',
                         \ 'kinds'     : [
                         \ 'p:package',
                         \ 'i:imports:1',
                         \ 'c:constants',
                         \ 'v:variables',
                         \ 't:types',
                         \ 'n:interfaces',
                         \ 'w:fields',
                         \ 'e:embedded',
                         \ 'm:methods',
                         \ 'r:constructor',
                         \ 'f:functions'
                         \ ],
                         \ 'sro' : '.',
                         \ 'kind2scope' : {
                         \ 't' : 'ctype',
                         \ 'n' : 'ntype'
                         \ },
                         \ 'scope2kind' : {
                         \ 'ctype' : 't',
                         \ 'ntype' : 'n'
                         \ },
                         \ 'ctagsbin'  : 'gotags',
                         \ 'ctagsargs' : '-sort -silent'
                         \ }
             let g:tagbar_type_php = {
                         \ 'ctagsbin'  : 'phpctags',
                         \ 'ctagsargs' : '-f -',
                         \ 'kinds'     : [
                         \ 'd:Constants:0:0',
                         \ 'v:Variables:0:0',
                         \ 'f:Functions:1',
                         \ 'i:Interfaces:0',
                         \ 'c:Classes:0',
                         \ 'p:Properties:0:0',
                         \ 'm:Methods:1',
                         \ 'n:Namespaces:0',
                         \ 't:Traits:0',
                         \ ],
                         \ 'sro'        : '::',
                         \ 'kind2scope' : {
                         \ 'c' : 'class',
                         \ 'm' : 'method',
                         \ 'f' : 'function',
                         \ 'i' : 'interface',
                         \ 'n' : 'namespace',
                         \ 't' : 'trait',
                         \ },
                         \ 'scope2kind' : {
                         \ 'class'     : 'c',
                         \ 'method'    : 'm',
                         \ 'function'  : 'f',
                         \ 'interface' : 'i',
                         \ 'namespace' : 'n',
                         \ 'trait'     : 't',
                         \ }
                         \ }
         endif
     " }

     " phpctags {
         if isdirectory(expand("~/.vim/plugged/phpctags"))
            let g:tagbar_phpctags_bin = '~/build-ext/phpctags'
            let g:tagbar_phpctags_memory_limit = '512M'
         endif
     " }

    " tabular {
         if isdirectory(expand("~/.vim/plugged/tabular"))
             nnoremap <Leader>t= :Tabularize /=<CR>
             vnoremap <Leader>t= :Tabularize /=<CR>
             nnoremap <Leader>t\| :Tabularize /\|<CR>
             vnoremap <Leader>t\| :Tabularize /\|<CR>
             nnoremap <Leader>t: :Tabularize /:\zs<CR>
             vnoremap <Leader>t: :Tabularize /:\zs<CR>
        endif
    " }

    " syntastic {
         if isdirectory(expand("~/.vim/plugged/syntastic"))
             " 每次调用:SyntasticSetLocList ，将错误覆盖 **quickfix**
             let g:syntastic_always_populate_loc_list=1
             " 自动拉起/关闭错误窗口，不需要手动调用:Errors
             let gysyntastic_auto_loc_list=1
             " 打开文件的时候做检查
             let g:syntastic_check_on_open=1
             " 每次保存的时候做检查
             let g:syntastic_check_on_wq=1
             let g:syntastic_enable_highlighting=1
             let g:jyntastic_python_checkers=['pyflakes']           " 使用pyflakes 比pylint快, 需要pip安装pyflakes，
             let g:syntastic_javascript_checkers=['jsl', 'jshint']  " npm install jsl jshint
             let g:syntastic_html_checkers=['tidy', 'jshint']       " brew install tidy-html5
             let g:syntastic_php_checkers=['php', 'phpcs']
             " checker gometalinter has  to golangci-lint
             let g:syntastic_go_checkers=['golangci_lint', 'gofmt', 'golint', 'go']
             let g:syntastic_php_phpcs_args="--standard=~/code-standards/phpcs_st.xml"
             " 修改高亮的背景色
             hi SyntasticErrorSign guifg=red guibg=black
             " syntastic信息加入状态栏
             " set statusline+=%{SyntasticStatusLineFlag()}
             " 配置error-sign
             let g:syntastic_error_symbol='✗'
             let g:syntastic_warning_symbol='⚠'
             let g:syntastic_aggregate_errors=1

             nnoremap <Leader>ts :SyntasticToggleMode<CR>
         endif
    "}

    " ALE {
        "--------------------------------
        " :ALEInfo check see what is currently configured
        " @todo sign column  red error
        " @todo support larastan
        "-------------------------------
        if isdirectory(expand("~/.vim/plugged/ale"))
            let g:ale_lint_on_text_changed='never'
            let g:ale_linters_explicit = 1
            let g:ale_echo_msg_format="[%linter%] %s [%severity%]"

            let g:ale_php_phpcs_standard='~/code-standards/phpcs_st.xml'
            "let g:ale_php_phpstan_executable='./vendor/bin/phpstan'
            let g:ale_php_phpstan_configuration='./phpstan.neon'
            let g:ale_php_phpstan_level = 5
            let g:ale_php_phpstan_memory_limit='2G'
            let g:ale_virtualtext_cursor = 'disabled'

            if has('nvim')
                "let g:ale_use_neovim_diagnostics_api = 1
            endif

            let g:ale_linters = {
                        \   'go':['gofmt', 'govet', 'gopls'],
                        \   'proto': ['protolint',],
                        \   'yaml': ['yamllint',],
                        \   'php': ['php', 'phpcs', 'phpactor', 'phpstan'],
                        \}
            let g:ale_go_golangci_lint_options = '--enable-all --config ~/.golangci.yml'
        endif
    " }

